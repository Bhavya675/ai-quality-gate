name: AI Quality Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-quality-gate:
    name: AI Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out trusted base-branch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Run AI pull-request review
        run: npm run review
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.6-flash
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_STATE_SIGNING_SECRET: ${{ secrets.REVIEW_STATE_SIGNING_SECRET }}
          REVIEW_POLICY_VERSION: 1.0.0
          REVIEW_GUIDELINES_SHA: ${{ hashFiles('docs/review-guidelines.md') }}
