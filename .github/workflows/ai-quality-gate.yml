name: AI Quality Gate

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ai-quality-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-quality-gate:
    name: AI Quality Gate

    uses: ./.github/workflows/ai-quality-gate-reusable.yml

    with:
      # Run trusted engine code from the PR's base commit.
      engine_ref: ${{ github.event.pull_request.base.sha }}

      gemini_model: gemini-3.6-flash

      review_policy_version: "1.0.0"

    permissions:
      contents: read
      pull-requests: write
      issues: write

    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      REVIEW_STATE_SIGNING_SECRET: ${{ secrets.REVIEW_STATE_SIGNING_SECRET }}
